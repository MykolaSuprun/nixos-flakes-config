# Herdr config — LIVE-EDITABLE (no nix rebuild needed).
#
# This file lives in the nixconf checkout and is symlinked into
# ~/.config/herdr/config.toml by home-manager/modules/herdr.nix
# (lib/live-links.nix — the same mechanism as the Hyprland Lua config).
# Edit it here, then reload without a rebuild:
#   - prefix+shift+r inside herdr, or: herdr server reload-config
#
# Herdr reads exactly ONE config file (no include/merge support) and may
# write to it itself — `onboarding = false` below keeps its writer idle.
# NEVER run `herdr config reset-keys`: it rewrites this file in place.
#
# Bindings are tmux-MOTION compatible (hjkl, prefix+letter verbs) but note:
# the prefix here is ctrl+e (NOT tmux's C-Space — tmux needs C-Space itself
# inside embedded panes).

# Skip first-run onboarding — we know what we're doing. Also required so
# herdr never tries to write to this file itself (first-run would persist
# `onboarding = false` on its own).
onboarding = false

[theme]
# Static initial theme. The DYNAMIC part is auto_switch: herdr follows the
# host terminal's light/dark appearance at runtime. (This value was chosen
# by catppuccin.flavor in Nix before the live-link conversion; herdr is
# only enabled on geks-nixos, whose flavor is latte.)
name = "catppuccin-latte"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[keys]
prefix = "ctrl+e"

# Pane navigation — prefix+h/j/k/l.
# Direct chords use Alt+Shift+h/j/k/l (tmux uses Alt+hjkl). The Shift
# modifier avoids interfering with normal typing in editors/shells.
focus_pane_left = ["prefix+h", "alt+shift+h"]
focus_pane_down = ["prefix+j", "alt+shift+j"]
focus_pane_up = ["prefix+k", "alt+shift+k"]
focus_pane_right = ["prefix+l", "alt+shift+l"]

# Pane swapping — prefix+Shift+h/j/k/l (tmux: Alt+Shift+hjkl)
swap_pane_left = ["prefix+shift+h"]
swap_pane_down = ["prefix+shift+j"]
swap_pane_up = ["prefix+shift+k"]
swap_pane_right = ["prefix+shift+l"]

# Pane splitting — match tmux: prefix+- (horizontal/stacked),
# prefix+v (vertical/side-by-side). tmux also uses prefix+|
# and prefix+" — herdr doesn't support those literal keys, so
# we rely on the minus/v bindings.
split_horizontal = "prefix+minus"
split_vertical = "prefix+v"

# Close pane — prefix+x (matches tmux)
close_pane = "prefix+x"

# Zoom — prefix+z (matches tmux)
zoom = "prefix+z"

# Resize mode — prefix+r (matches tmux's prefix+M-C-hjkl resize;
# herdr uses a resize *mode* instead, entered with prefix+r)
resize_mode = "prefix+r"

# ── Tabs (windows in tmux) ───────────────────────────────────
# New tab — prefix+c (matches tmux)
new_tab = "prefix+c"

# Tab switching — prefix+n/p (matches tmux), plus Alt+Shift+i/u
# direct chords (tmux uses Alt+Shift+U/I without prefix)
next_tab = ["prefix+n", "alt+shift+i"]
previous_tab = ["prefix+p", "alt+shift+u"]

# Jump to tab 1-9 — prefix+1..9 (matches tmux)
switch_tab = "prefix+1..9"

# Rename tab — prefix+Shift+t (tmux uses prefix+,)
rename_tab = "prefix+shift+t"

# Close tab — prefix+Shift+x
close_tab = "prefix+shift+x"

# ── Workspaces (sessions in tmux) ────────────────────────────
# Native picker/navigator live on Ctrl fallbacks — prefix+w and
# prefix+g are handled by plugins (see [[keys.command]] below).
workspace_picker = "prefix+ctrl+w"

# Workspace navigation in the picker — vim-style j/k (defaults
# are arrow keys; keep them as aliases). Matches the hjkl
# pane-navigation motion used elsewhere.
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]

# Goto navigator — native kept on Ctrl fallback (plugin on prefix+g)
goto = "prefix+ctrl+g"

# Instant jumps — no picker needed for ≤9 (mirrors prefix+1..9 tabs)
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# Step through workspaces/agents without opening a picker.
# prefix+o takes the tmux sesh-picker slot; shift+n stays
# new_workspace so next-workspace uses o instead.
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+o"
previous_agent = "prefix+alt+p"
next_agent = "prefix+alt+n"

# New workspace — prefix+Shift+n
new_workspace = "prefix+shift+n"

# Rename workspace — prefix+Shift+w
rename_workspace = "prefix+shift+w"

# Close workspace — prefix+Shift+d
close_workspace = "prefix+shift+d"

# ── Session ──────────────────────────────────────────────────
# Detach — prefix+q (matches herdr default; tmux uses prefix+d)
detach = "prefix+q"

# Copy mode — prefix+[ (matches tmux)
copy_mode = "prefix+["

# Toggle sidebar — prefix+b
toggle_sidebar = "prefix+b"

# Help — prefix+? (matches tmux's list-keys)
help = "prefix+?"

# Settings — prefix+s
settings = "prefix+s"

# Reload config — prefix+shift+r
reload_config = "prefix+shift+r"

# Cycle panes — prefix+Tab / prefix+Shift+Tab
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Edit scrollback in $EDITOR — prefix+e
edit_scrollback = "prefix+e"

# ── Plugin actions ───────────────────────────────────────────
# Installed imperatively (herdr has no declarative plugin support; registry:
# ~/.config/herdr/plugins.json):
#   preview-grid — LOCAL dev plugin: herdr plugin link
#     ~/workspaces/src/herdr-preview-grid (preview wall; config in
#     plugins/config/preview-grid/config.toml)
#   simple-switcher — herdr plugin install haphamdev/herdr-simple-switcher
#     (fzf; PROJECTS_ROOT in plugins/config/simple-switcher/config.env
#     drives open-project)
#   yoshiori.herdr-configurable-picker — herdr plugin install
#     yoshiori/herdr-configurable-picker (goto tree)
# preview-grid took over prefix+w (spaces) and prefix+a (agents) from
# simple-switcher's fzf switchers (2026-10-02). To get fzf back, swap the
# command to simple-switcher.switch-workspace / .switch-agent and reload.
# NOTE: this file is the home of plugin bindings — plugin work adds/edits
# its [[keys.command]] entries HERE, not in any nix file.
[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "preview-grid.spaces"
description = "switch space (preview grid)"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "simple-switcher.switch-tab"
description = "switch tab (fzf)"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "preview-grid.agents"
description = "switch agent (preview grid)"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "simple-switcher.open-project"
description = "open project (fzf)"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "yoshiori.herdr-configurable-picker.open"
description = "goto picker (tree)"

# Sidebar jump codes (preview-grid): rows carry a $jump badge; this popup
# takes the code and focuses its target. Esc cancels. Sized 46x12 to show
# the live listing of all coded targets (spaces, agents, tabs, panes);
# filter by typing, '/' fuzzy-searches labels.
# By-name form (works once the Nix-managed rebuild puts the plugin bin on
# session PATH), with the dev checkout as fallback until that lands —
# drop `|| …` after the first successful rebuild + herdr server restart.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/home/mykolas/workspaces/src/herdr-preview-grid/bin/herdr-preview-grid jump"
width = 46
height = 12
description = "jump to code"

# Direct "shift+prefix" chord — one keystroke, same popup. herdr has no
# symbolic shift+prefix form (key strings are literal chords), so this is
# a CONVENTION tied to [keys] prefix = "ctrl+e" one table above: change
# the prefix, re-derive this chord by hand. Needs a terminal that
# distinguishes ctrl+shift+e from ctrl+e (Ghostty does; where they
# collide the binding is inert and the prefix keeps working).
[[keys.command]]
key = "ctrl+shift+e"
type = "popup"
command = "/home/mykolas/workspaces/src/herdr-preview-grid/bin/herdr-preview-grid jump"
width = 46
height = 12
description = "jump to code (shift+prefix)"

# NOTE: opening the jump popup reveals the tab-bar jump codes; firing any
# code hides them again. No separate toggle chord — the jump chord IS the
# trigger. (prefix+ctrl+e is not bindable: herdr disables prefix+<prefix>.)

[terminal]
# Follow the focused pane's working directory for new panes/tabs,
# matching tmux's `-c "#{pane_current_path}"` behaviour.
new_cwd = "follow"

[ui]
# Copy selected text with the mouse (matches tmux's set-clipboard)
copy_on_select = true
# Draw borders around split panes
pane_borders = true
pane_gaps = true
# Confirm before closing a workspace
confirm_close = true
# Hide tab bar when only one tab exists
hide_tab_bar_when_single_tab = true

# ── Sidebar jump codes ───────────────────────────────────────
# Rows replicate the herdr defaults + a bold $jump badge at the row end.
# Values are reported as metadata tokens (--source user:jumpd) by the
# preview-grid jump tooling; unreported $jump tokens simply disappear.
# Revert = delete these two tables (herdr defaults apply again).
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", { token = "$jump", bold = true }],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "$jump", bold = true }],
]

[session]
# Resume agent conversations after a server restart (like tmux
# resurrect/continuum, but for AI agent sessions).
resume_agents_on_restore = true
