general {
    lock_cmd = session_lock
    # before_sleep_cmd is required again: the lock screen is now swaylock
    # (noctalia's own lock screen is disabled — it crashes on resume from
    # suspend), so nothing else locks pre-suspend.
    before_sleep_cmd = session_lock
    # Passive safety net: on wake, restore swaylock ONLY if it died while the
    # session was locked. A living lock client is never touched — the normal
    # wake → unlock flow is unaffected.
    after_sleep_cmd = fix-lock --auto
    inhibit_sleep = 3                               # wait until the session gets locked by a lock screen app
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 240                                # 4 min
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

# No DPMS-off listener: it fires while the session is locked, which is a
# documented lock-screen killer on AMD (hyprwm/hyprlock#953), and legacy
# `hyprctl dispatch` is broken under the Lua config anyway. Monitors wake
# automatically from suspend.

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
