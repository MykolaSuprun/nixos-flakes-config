general {
    lock_cmd = session_lock
    # session_lock fans out per shell (see hyprland/pkgs.nix): dms IPC /
    # swaylock (the single lock — caelestia was disabled 2026-10-11; the old
    # "no shell" hyprlock fallback is gone). fix-lock --record snapshots the
    # pre-suspend lock state (instant, never blocks suspend) so
    # after_sleep_cmd can repair a clientless lock even when logind
    # LockedHint says no (keybind locks, Hyprland lock-restore state).
    before_sleep_cmd = fix-lock --record; session_lock
    # Passive safety net: immediate repair pass on wake + a detached --recheck
    # 10s later. The delayed pass is required: the amdgpu/DRI output-reset
    # storm kills Wayland clients ~1s AFTER resume, i.e. after the immediate
    # check has already run. A living lock client is never touched — the
    # normal wake → unlock flow is unaffected.
    after_sleep_cmd = fix-lock --auto
    inhibit_sleep = 3                               # wait until the session gets locked by a lock screen app
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 240                                # 4 min
    # loginctl lock-session only sets logind's LockedHint — it never RUNS a
    # lock client, so the screen stayed visibly unlocked. Call the lock
    # itself: session_lock fans out qs-flow-lock -> swaylock.
    on-timeout = session_lock                    # lock screen when idle timeout passed
}

# No DPMS-off listener: it fires while the session is locked, which is a
# documented lock-screen killer on AMD (hyprwm/hyprlock#953), and legacy
# `hyprctl dispatch` is broken under the Lua config anyway. Monitors wake
# automatically from suspend.

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
